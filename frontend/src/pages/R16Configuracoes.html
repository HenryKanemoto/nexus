<div class="page max-w-3xl">
  <header>
    <h1 class="page-title">Configurações</h1>
    <p class="page-subtitle">Regras do acervo que valem para todos os empréstimos.</p>
  </header>

  @if (mensagemSucesso()) {
    <div role="status" class="alert alert-ok items-center">
      <mat-icon class="icon-sm">check_circle</mat-icon>
      <p class="flex-1">{{ mensagemSucesso() }}</p>
      <button type="button" (click)="mensagemSucesso.set(null)" class="btn-icon size-8" aria-label="Fechar aviso">
        <mat-icon class="icon-sm">close</mat-icon>
      </button>
    </div>
  }

  <section class="card card-pad flex flex-col gap-5">
    <fieldset class="flex flex-col gap-3">
      <legend class="mb-3">
        <span class="block font-display text-lg font-semibold">O que acontece quando alguém atrasa a devolução?</span>
        <span class="mt-0.5 block text-sm text-ink-muted">Vale para os próximos atrasos e devoluções a partir de agora.</span>
      </legend>

      @for (opcao of opcoes; track opcao.valor) {
        <label
          class="flex cursor-pointer items-start gap-4 rounded-control border p-4 transition-colors has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-ink"
          [class]="politicaSelecionada() === opcao.valor ? 'border-ink bg-accent-soft' : 'border-line-strong hover:border-ink'"
        >
          <input
            type="radio"
            name="politica"
            class="mt-1 size-4 shrink-0 accent-ink"
            [value]="opcao.valor"
            [checked]="politicaSelecionada() === opcao.valor"
            (change)="selecionar(opcao.valor)"
          />
          <span>
            <span class="flex flex-wrap items-center gap-2 font-medium">
              {{ opcao.titulo }}
              @if (opcao.valor === 'rigida') {
                <span class="rounded-full bg-ink px-2 py-0.5 text-[0.6875rem] font-medium text-white">padrão</span>
              }
              @if (politicaAtual() === opcao.valor) {
                <span class="text-xs font-normal text-ink-muted">· em vigor</span>
              }
            </span>
            <span class="mt-0.5 block text-sm text-ink-soft">{{ opcao.descricao }}</span>
          </span>
        </label>
      }
    </fieldset>

    <div class="flex justify-end border-t border-line pt-5">
      <button type="button" (click)="salvar()" class="btn btn-primary" [disabled]="politicaSelecionada() === politicaAtual()">
        <mat-icon class="icon-sm">save</mat-icon>
        Salvar
      </button>
    </div>
  </section>
</div>
